# VitalSynth — real Vital engine on the Pi. Patches: /etc/vitalsynth.d/*.vital
breath_cc = 74           # NuEVI breath -> Vital macro1 (patch routes macro1 -> filter)
breath_to_at = 1        # mirror breath to channel aftertouch (DAW-rig behavior)
# 3 ms, not 8: the one-pole runs once per chunk, so 8 cost 6.67 ms of group
# delay on the breath contour. Do NOT go below 3 -- the filter is bypassed
# entirely once breath_smooth_ms <= 1000*chunk/rate, which is 2.67 ms if the
# period ever falls back to the in-source default of 128 frames.
breath_smooth_ms = 3
patch_cc = -1            # optional CC to cycle patches (Program Change also works)
patch_dir = /etc/vitalsynth.d
audio_device = auto      # USB DAC > headphone jack > HDMI (or an explicit
                         # ALSA name like plughw:CARD=HA3,DEV=0)
# Which USB DAC wins when several are plugged in, best first; matched against
# the ALSA card id or name. Any USB DAC still beats the jack/HDMI even if it
# is not listed here.
audio_prefer = HA3,ATR2xUSB
# MIDI controller priority, best first. Only ONE source is subscribed at a time,
# so the wireless receiver and the EWI's own USB port cannot double every note.
#
# The midiBeam RX02 wireless receiver feeds its DIN output into a CME U2MIDI Pro
# USB adapter (usb 7104:1400), which is what actually appears to ALSA -- the
# receiver's other USB lead is power only and never shows up here. Named
# explicitly rather than with a "*" wildcard: with no wildcard an unlisted
# device sorts BELOW the EWI, so a stray USB MIDI gadget cannot steal the input.
# Listing distinct names also keeps the receiver and the EWI on different ranks;
# at equal rank the winner would depend on ALSA client numbering, i.e. plug order.
# Entries match the ALSA client name, case-insensitively, as a substring.
# Run `midisources` to see what is attached and which one won.
midi_prefer = U2MIDI Pro, midiBeam, RX02, NuEVI, Teensyduino

sample_rate = 48000
period_frames = 64
periods = 2
master_gain_db = 0
limiter_thresh = 0.95
# Every logged event is an unbuffered write into journald on the MIDI thread,
# so 0 is very slightly lower-jitter. Kept at 1 while the RX02 wireless link is
# being commissioned: this trace is the only thing that would show it dropping
# or doubling notes, and pushing to the ring now happens BEFORE the log, which
# removes the stall hazard that made 0 attractive. Flip to 0 once the link is
# proven over a full rehearsal.
log_midi = 1
oversampling = -1        # -1 keep patch setting; 0 force 1x (lowest CPU)
