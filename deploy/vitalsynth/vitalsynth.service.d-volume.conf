[Service]
# The Cubilux HA-3 powers up at 53% (-23.50 dB) and was repeatedly found there
# despite a stored 100% state, which cost ~23 dB on everything. Rather than rely
# on the restore path, force the output card to full level on every start.
# (The exit-99 alsactl errors in the journal are from MIDI-only cards, which
# have no mixer to restore -- they are noise, not this.)
# A hot-plugged DAC makes the synth exit and systemd restart it, so replugging
# is covered too. '-' so a missing card never blocks startup.
ExecStartPre=-/usr/local/bin/vitalvol.sh startup-max
