# Inline volume keys (the ATR2x-USB has a knob; the Cubilux HA-3 does not) ->
# whichever card vitalsynth is currently playing through. vitalvol.sh resolves
# the card and its mixer control on every press, so swapping dongles needs no
# edit here.
KEY_VOLUMEUP    1  /usr/local/bin/vitalvol.sh up
KEY_VOLUMEUP    2  /usr/local/bin/vitalvol.sh up
KEY_VOLUMEDOWN  1  /usr/local/bin/vitalvol.sh down
KEY_VOLUMEDOWN  2  /usr/local/bin/vitalvol.sh down
KEY_MUTE        1  /usr/local/bin/vitalvol.sh toggle
